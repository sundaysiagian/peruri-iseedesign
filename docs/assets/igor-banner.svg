<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
  <title id="title">IGOR FPGA local planner</title>
  <desc id="desc">Four parallel evaluators, 158.76 microsecond simulated DWA kernel, 400 exact neural outputs, and two compiled FPGA targets.</desc>
  <rect width="1200" height="350" rx="20" fill="#0b1220"/>
  <path d="M825 0v350M900 0v350M975 0v350M1050 0v350M1125 0v350M750 75h450M750 150h450M750 225h450M750 300h450" stroke="#17283d" stroke-width="1"/>
