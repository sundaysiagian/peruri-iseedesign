    <text x="331" y="275" font-size="25" font-weight="700" fill="#f8fafc">512 × 20</text><text x="331" y="299" font-size="13" fill="#b9cadb">Candidates × poses per run</text>
    <rect x="576" y="246" width="249" height="72" rx="12" fill="#132136" stroke="#253a51"/>
    <text x="595" y="275" font-size="25" font-weight="700" fill="#f8fafc">400 / 400</text><text x="595" y="299" font-size="13" fill="#b9cadb">Exact neural outputs · 100 vectors</text>
    <rect x="840" y="246" width="312" height="72" rx="12" fill="#132136" stroke="#253a51"/>
    <text x="859" y="275" font-size="25" font-weight="700" fill="#f8fafc">Nano + Lite</text><text x="859" y="299" font-size="13" fill="#b9cadb">Separate compiled FPGA targets</text>
  </g>
