  <text x="164" y="51" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" letter-spacing="1.4" fill="#7de3d0">ISEEDESIGNITB · PERURI 2026</text>
  <text x="44" y="139" font-family="Arial, sans-serif" font-size="76" font-weight="700" letter-spacing="3" fill="#f8fafc">IGOR</text>
  <text x="48" y="180" font-family="Arial, sans-serif" font-size="22" fill="#c6d5e5">Four-tile FPGA planning. Inspectable decisions.</text>
  <text x="48" y="209" font-family="Arial, sans-serif" font-size="15" fill="#8ba5bd">RTL · Integer neural inference · Safety gate · TinyTapeout prototype</text>
  <g font-family="Arial, sans-serif">
    <rect x="48" y="246" width="249" height="72" rx="12" fill="#132136" stroke="#253a51"/>
